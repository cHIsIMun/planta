apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: loja
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: api
          image: loja/api:1.4
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: loja
spec:
  type: ClusterIP
  selector:
    app: api
